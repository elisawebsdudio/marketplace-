<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - MarketPlace</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }

        nav {
            background: #087f5b;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 6px;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 430px;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #087f5b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        .normal-input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .input-box {
            position: relative;
            margin-top: 7px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .eye-button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 35px;
            height: 35px;
            padding: 0;
            margin: 0;
            background: transparent;
            color: #555;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-button:hover {
            background: #f0f0f0;
            color: #087f5b;
        }

        .login-button,
        .reset-button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button {
            background: #087f5b;
        }

        .login-button:hover {
            background: #066b4d;
        }

        .login-button:disabled,
        .reset-button:disabled {
            background: #7aa99a;
            cursor: not-allowed;
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: 10px;
            color: #087f5b;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .reset-box {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .reset-box h2 {
            color: #087f5b;
            text-align: center;
            font-size: 21px;
        }

        .reset-button {
            background: #2563eb;
        }

        .reset-button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            line-height: 1.5;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #087f5b;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="login.html">
            Login
        </a>

        <a href="register.html">
            Register
        </a>

    </nav>


    <div class="container">

        <div class="box">

            <h1>
                Login
            </h1>


            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    class="normal-input"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="eye-button"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>


                <a
                    href="#"
                    id="forgotPassword"
                    class="forgot-link"
                >
                    Forgot Password?
                </a>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- PASSWORD RESET -->

            <div
                id="resetBox"
                class="reset-box"
            >

                <h2>
                    Reset Your Password
                </h2>

                <p>
                    Enter your email address and we'll send you a password reset link.
                </p>

                <input
                    type="email"
                    id="resetEmail"
                    class="normal-input"
                    placeholder="Enter your email"
                >

                <button
                    type="button"
                    id="resetButton"
                    class="reset-button"
                >
                    Send Reset Link
                </button>

            </div>


            <p id="message"></p>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>



    <script>

        // ==============================
        // SUPABASE CONNECTION
        // ==============================

        const SUPABASE_URL =
            "https://zofngbuatccapcypmvkf.supabase.co";


        // ADD YOUR EXISTING PUBLISHABLE KEY HERE

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_ifpnnnvmw3cOAaykROZPaA_4DZ8tDLh";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // ==============================
        // ELEMENTS
        // ==============================

        const form =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");

        const loginButton =
            document.getElementById("loginButton");

        const forgotPassword =
            document.getElementById("forgotPassword");

        const resetBox =
            document.getElementById("resetBox");

        const resetEmail =
            document.getElementById("resetEmail");

        const resetButton =
            document.getElementById("resetButton");

        const message =
            document.getElementById("message");


        // ==============================
        // SHOW / HIDE PASSWORD
        // ==============================

        togglePassword.addEventListener(
            "click",
            function() {

                if (
                    passwordInput.type === "password"
                ) {

                    passwordInput.type = "text";

                    togglePassword.textContent = "🙈";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                } else {

                    passwordInput.type = "password";

                    togglePassword.textContent = "👁️";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                }

            }
        );


        // ==============================
        // SHOW RESET BOX
        // ==============================

        forgotPassword.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                resetBox.style.display = "block";

                resetEmail.value =
                    emailInput.value.trim();

                message.textContent = "";

                resetEmail.focus();

            }
        );


        // ==============================
        // SEND PASSWORD RESET EMAIL
        // ==============================

        resetButton.addEventListener(
            "click",
            async function() {

                const email =
                    resetEmail.value
                    .trim()
                    .toLowerCase();


                if (!email) {

                    message.textContent =
                        "Please enter your email address.";

                    message.style.color = "red";

                    return;
                }


                resetButton.disabled = true;

                resetButton.textContent =
                    "Sending...";


                message.textContent = "";


                try {

                    const redirectUrl =
                        window.location.origin +
                        "/update-password.html";


                    const { error } =
                        await supabaseClient.auth
                            .resetPasswordForEmail(
                                email,
                                {
                                    redirectTo:
                                        redirectUrl
                                }
                            );


                    if (error) {

                        throw error;

                    }


                    message.textContent =
                        "If an account exists for this email, a password reset link has been sent. Check your email.";

                    message.style.color =
                        "green";


                } catch (error) {

                    console.error(
                        "PASSWORD RESET ERROR:",
                        error
                    );

                    message.textContent =
                        "Could not send the reset email. Please try again.";

                    message.style.color =
                        "red";

                } finally {

                    resetButton.disabled = false;

                    resetButton.textContent =
                        "Send Reset Link";

                }

            }
        );


        // ==============================
        // LOGIN
        // ==============================

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    emailInput.value
                    .trim()
                    .toLowerCase();


                const password =
                    passwordInput.value;


                message.textContent = "";


                loginButton.disabled = true;

                loginButton.textContent =
                    "Logging in...";


                try {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth
                            .signInWithPassword({
                                email: email,
                                password: password
                            });


                    if (error) {

                        message.textContent =
                            error.message;

                        message.style.color =
                            "red";

                        return;

                    }


                    const user =
                        data.user;


                    const userName =
                        user &&
                        user.user_metadata
                            ? user.user_metadata.name || ""
                            : "";


                    localStorage.setItem(
                        "loggedIn",
                        "true"
                    );

                    localStorage.setItem(
                        "userId",
                        user.id
                    );

                    localStorage.setItem(
                        "userName",
                        userName
                    );

                    localStorage.setItem(
                        "userEmail",
                        user.email || email
                    );


                    message.textContent =
                        "Login successful!";

                    message.style.color =
                        "green";


                    setTimeout(
                        function() {

                            window.location.href =
                                "account.html";

                        },
                        700
                    );


                } catch (error) {

                    console.error(
                        "LOGIN ERROR:",
                        error
                    );

                    message.textContent =
                        "Unable to login. Please try again.";

                    message.style.color =
                        "red";

                } finally {

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );

    </script>

</body>

</html>
