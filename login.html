<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - MarketPlace</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }

        nav {
            background: #087f5b;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 6px;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 430px;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #087f5b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        /* PASSWORD BOX */

        .password-box {
            position: relative;
            margin-top: 7px;
        }

        .password-box input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            margin-top: 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        /* EYE BUTTON */

        .eye-button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);

            width: 35px;
            height: 35px;

            padding: 0;
            margin: 0;

            background: transparent;
            color: #555;

            border: none;
            border-radius: 50%;

            font-size: 19px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-button:hover {
            background: #f0f0f0;
            color: #087f5b;
        }

        button.login-button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button.login-button:hover {
            background: #066b4d;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #087f5b;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

</head>


<body>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="login.html">
            Login
        </a>

        <a href="register.html">
            Register
        </a>

    </nav>


    <div class="container">

        <div class="box">

            <h1>
                Login
            </h1>


            <form id="loginForm">


                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-button"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>


            </form>


            <p id="message"></p>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>


    <script>


        /* =========================
           GET ELEMENTS
        ========================= */

        const form =
            document.getElementById(
                "loginForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const togglePassword =
            document.getElementById(
                "togglePassword"
            );


        /* =========================
           SHOW / HIDE PASSWORD
        ========================= */

        togglePassword.addEventListener(
            "click",
            function() {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    togglePassword.textContent =
                        "🙈";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                } else {

                    passwordInput.type =
                        "password";

                    togglePassword.textContent =
                        "👁️";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                }

            }
        );


        /* =========================
           LOGIN
        ========================= */

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "email"
                    )
                    .value
                    .trim()
                    .toLowerCase();


                const password =
                    passwordInput.value;


                /* GET USERS */

                let users = [];


                try {

                    const savedUsers =
                        localStorage.getItem(
                            "users"
                        );


                    if (savedUsers) {

                        users =
                            JSON.parse(
                                savedUsers
                            );

                    }


                    if (
                        !Array.isArray(
                            users
                        )
                    ) {

                        users = [];

                    }

                } catch (error) {

                    users = [];

                }


                /* FIND USER */

                const user =
                    users.find(
                        function(account) {

                            return (

                                String(
                                    account.email ||
                                    ""
                                )
                                .toLowerCase() ===
                                email

                                &&

                                account.password ===
                                password

                            );

                        }
                    );


                /* LOGIN FAILED */

                if (!user) {

                    message.textContent =
                        "Incorrect email or password.";

                    message.style.color =
                        "red";

                    return;

                }


                /* SAVE LOGIN */

                localStorage.setItem(
                    "loggedIn",
                    "true"
                );


                localStorage.setItem(
                    "userId",
                    String(user.id)
                );


                localStorage.setItem(
                    "userName",
                    user.name
                );


                localStorage.setItem(
                    "userEmail",
                    user.email
                );


                /* SUCCESS */

                message.textContent =
                    "Login successful!";

                message.style.color =
                    "green";


                /* GO TO ACCOUNT */

                setTimeout(
                    function() {

                        window.location.href =
                            "account.html";

                    },
                    800
                );

            }
        );


    </script>

</body>

</html>
