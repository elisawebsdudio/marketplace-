<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - MarketPlace</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }

        nav {
            background: #087f5b;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 6px;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 430px;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #087f5b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        .normal-input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .input-box {
            position: relative;
            margin-top: 7px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .eye-button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);

            width: 35px;
            height: 35px;

            padding: 0;
            margin: 0;

            background: transparent;
            color: #555;

            border: none;
            border-radius: 50%;

            font-size: 18px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-button:hover {
            background: #f0f0f0;
            color: #087f5b;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #066b4d;
        }

        .login-button:disabled {
            background: #7aa99a;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #087f5b;
            font-weight: bold;
            text-decoration: none;
        }

    </style>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="login.html">
            Login
        </a>

        <a href="register.html">
            Register
        </a>

    </nav>


    <div class="container">

        <div class="box">

            <h1>
                Login
            </h1>


            <form id="loginForm">


                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    class="normal-input"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="button"
                        id="togglePassword"
                        class="eye-button"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>


            </form>


            <p id="message"></p>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>


    <script>


        /* =========================
           SUPABASE CONNECTION
        ========================= */

        const SUPABASE_URL =
            "https://zofngbuatccapcypmvkf.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_ifpnnnvmw3cOAaykROZPaA_4DZ8tDLh";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================
           ELEMENTS
        ========================= */

        const form =
            document.getElementById(
                "loginForm"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const togglePassword =
            document.getElementById(
                "togglePassword"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        /* =========================
           SHOW / HIDE PASSWORD
        ========================= */

        togglePassword.addEventListener(
            "click",
            function() {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    togglePassword.textContent =
                        "🙈";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                } else {

                    passwordInput.type =
                        "password";

                    togglePassword.textContent =
                        "👁️";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                }

            }
        );


        /* =========================
           LOGIN
        ========================= */

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    emailInput.value
                    .trim()
                    .toLowerCase();


                const password =
                    passwordInput.value;


                message.textContent =
                    "";


                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Logging in...";


                try {


                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth.signInWithPassword({

                            email:
                                email,

                            password:
                                password

                        });


                    if (error) {

                        message.textContent =
                            error.message;

                        message.style.color =
                            "red";

                        return;

                    }


                    /* =========================
                       GET USER
                    ========================= */

                    const user =
                        data.user;


                    const userName =
                        user &&
                        user.user_metadata
                        ? user.user_metadata.name || ""
                        : "";


                    /* =========================
                       SAVE BASIC LOGIN INFO
                       FOR EXISTING PAGES
                    ========================= */

                    localStorage.setItem(
                        "loggedIn",
                        "true"
                    );


                    localStorage.setItem(
                        "userId",
                        user.id
                    );


                    localStorage.setItem(
                        "userName",
                        userName
                    );


                    localStorage.setItem(
                        "userEmail",
                        user.email || email
                    );


                    /* =========================
                       SUCCESS
                    ========================= */

                    message.textContent =
                        "Login successful!";

                    message.style.color =
                        "green";


                    setTimeout(
                        function() {

                            window.location.href =
                                "account.html";

                        },
                        700
                    );


                } catch (error) {

                    message.textContent =
                        "Unable to login. Please try again.";

                    message.style.color =
                        "red";

                } finally {

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );

    </script>


</body>

</html>
