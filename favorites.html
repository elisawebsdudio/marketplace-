<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Favorites - MarketPlace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f6;
}

nav {
    background: #087f5b;
    padding: 15px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 5px;
    font-weight: bold;
}

.container {
    width: 94%;
    max-width: 1100px;
    margin: 30px auto;
}

h1 {
    text-align: center;
    color: #087f5b;
}

#message {
    text-align: center;
    font-weight: bold;
    margin: 15px;
    line-height: 1.5;
}

#favoritesContainer {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.product-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

.product-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    background: #eee;
}

.product-info {
    padding: 18px;
}

.product-info h2 {
    color: #087f5b;
    margin-top: 0;
}

.price {
    font-size: 20px;
    font-weight: bold;
}

.category {
    display: inline-block;
    background: #e8fff7;
    color: #087f5b;
    padding: 6px 10px;
    border-radius: 15px;
    font-weight: bold;
}

.button {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
    text-align: center;
    text-decoration: none;
    font-size: 16px;
    cursor: pointer;
}

.details-button {
    background: #087f5b;
    color: white;
}

.remove-button {
    background: #d62828;
    color: white;
}

.empty {
    background: white;
    padding: 40px 20px;
    text-align: center;
    border-radius: 12px;
    grid-column: 1 / -1;
}

.empty h2 {
    color: #087f5b;
}

.empty a {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 20px;
    background: #087f5b;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

</style>

</head>


<body>


<nav>

<a href="index.html">Home</a>

<a href="products.html">Products</a>

<a href="post-products.html">Post Product</a>

<a href="favorites.html">Favorites</a>

<a href="my-products.html">My Products</a>

<a href="account.html">My Account</a>

</nav>


<div class="container">

<h1>
❤️ My Favorites
</h1>

<p id="message"></p>

<div id="favoritesContainer"></div>

</div>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://zofngbuatccapcypmvkf.supabase.co";

const SUPABASE_KEY =
"YOUR_EXISTING_PUBLISHABLE_KEY";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   ELEMENTS
================================= */

const favoritesContainer =
document.getElementById(
    "favoritesContainer"
);

const message =
document.getElementById(
    "message"
);


/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =================================
   LOAD FAVORITES
================================= */

async function loadFavorites() {

    try {

        message.textContent =
            "Checking your login...";


        /* CHECK LOGIN */

        const {
            data: authData,
            error: authError
        } =
        await supabaseClient.auth.getUser();


        if (authError) {

            throw new Error(
                authError.message
            );

        }


        const user =
            authData.user;


        if (!user) {

            favoritesContainer.innerHTML = `

                <div class="empty">

                    <h2>
                        Login Required
                    </h2>

                    <p>
                        Please login to view
                        your favorite products.
                    </p>

                    <a href="login.html">
                        Login
                    </a>

                </div>

            `;

            message.textContent = "";

            return;
        }


        message.textContent =
            "Loading your favorites...";


        /* =================================
           GET FAVORITES
        ================================= */

        const {
            data: favoriteRows,
            error: favoriteError
        } =
        await supabaseClient
            .from("favorites")
            .select("product_id, created_at")
            .eq("user_id", user.id)
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (favoriteError) {

            throw new Error(
                "Could not load favorites: " +
                favoriteError.message
            );

        }


        /* NO FAVORITES */

        if (
            !favoriteRows ||
            favoriteRows.length === 0
        ) {

            showEmptyFavorites();

            return;
        }


        /* =================================
           GET PRODUCT IDS
        ================================= */

        const productIds =
            favoriteRows.map(
                function(row) {
                    return row.product_id;
                }
            );


        /* =================================
           GET PRODUCTS
        ================================= */

        const {
            data: products,
            error: productError
        } =
        await supabaseClient
            .from("products")
            .select("*")
            .in("id", productIds);


        if (productError) {

            throw new Error(
                "Could not load products: " +
                productError.message
            );

        }


        /* =================================
           DISPLAY IN FAVORITE ORDER
        ================================= */

        const productMap =
            new Map();


        products.forEach(
            function(product) {

                productMap.set(
                    String(product.id),
                    product
                );

            }
        );


        favoritesContainer.innerHTML = "";

        let foundProduct = false;


        favoriteRows.forEach(
            function(favorite) {

                const product =
                    productMap.get(
                        String(
                            favorite.product_id
                        )
                    );


                if (!product) {
                    return;
                }


                foundProduct = true;


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "product-card";


                card.innerHTML = `

                    <img
                        src="${escapeHTML(
                            product.image_url || ""
                        )}"
                        alt="${escapeHTML(
                            product.name || "Product"
                        )}"
                    >

                    <div class="product-info">

                        <h2>
                            ${escapeHTML(
                                product.name ||
                                "Product"
                            )}
                        </h2>

                        <p class="price">
                            ${escapeHTML(
                                product.price ||
                                "Price not provided"
                            )}
                        </p>

                        <p>

                            <span class="category">
                                ${escapeHTML(
                                    product.category ||
                                    "Other"
                                )}
                            </span>

                        </p>

                        <p>
                            ${escapeHTML(
                                product.description ||
                                "No description available."
                            )}
                        </p>

                        <a
                            href="product-details.html?id=${encodeURIComponent(
                                product.id
                            )}"
                            class="button details-button"
                        >
                            👁️ View Details
                        </a>

                        <button
                            type="button"
                            class="button remove-button"
                        >
                            ❤️ Remove Favorite
                        </button>

                    </div>

                `;


                favoritesContainer.appendChild(
                    card
                );


                /* =================================
                   REMOVE FAVORITE
                ================================= */

                const removeButton =
                    card.querySelector(
                        ".remove-button"
                    );


                removeButton.addEventListener(
                    "click",
                    async function() {

                        removeButton.disabled =
                            true;

                        removeButton.textContent =
                            "Removing...";


                        const {
                            error: deleteError
                        } =
                        await supabaseClient
                            .from("favorites")
                            .delete()
                            .eq(
                                "user_id",
                                user.id
                            )
                            .eq(
                                "product_id",
                                product.id
                            );


                        if (deleteError) {

                            console.error(
                                deleteError
                            );

                            message.textContent =
                                "Could not remove favorite: " +
                                deleteError.message;

                            message.style.color =
                                "red";

                            removeButton.disabled =
                                false;

                            removeButton.textContent =
                                "❤️ Remove Favorite";

                            return;
                        }


                        message.textContent =
                            "Removed from favorites.";

                        message.style.color =
                            "#d62828";


                        loadFavorites();

                    }
                );

            }
        );


        if (!foundProduct) {

            showEmptyFavorites();

            return;
        }


        message.textContent =
            "";

    } catch (error) {

        console.error(error);

        favoritesContainer.innerHTML = "";

        message.textContent =
            "Error: " + error.message;

        message.style.color =
            "red";
    }

}


/* =================================
   EMPTY FAVORITES
================================= */

function showEmptyFavorites() {

    message.textContent = "";

    favoritesContainer.innerHTML = `

        <div class="empty">

            <h2>
                No Favorite Products
            </h2>

            <p>
                Products you save as
                favorites will appear here.
            </p>

            <a href="products.html">
                Browse Products
            </a>

        </div>

    `;
}


/* =================================
   START
================================= */

loadFavorites();

</script>


</body>

</html>
