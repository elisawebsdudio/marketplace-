<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Products - MarketPlace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f6;
}

nav {
    background: #087f5b;
    padding: 15px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 5px;
    font-weight: bold;
}

.container {
    width: 94%;
    max-width: 1100px;
    margin: 30px auto;
}

h1 {
    text-align: center;
    color: #087f5b;
}

.search-box {
    background: white;
    padding: 15px;
    margin: 20px 0 25px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.search-box input,
.search-box select {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

.search-box select {
    margin-bottom: 0;
}

#productsContainer {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.product-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}

.product-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    background: #eee;
}

.product-info {
    padding: 18px;
}

.product-info h2 {
    color: #087f5b;
    margin-top: 0;
}

.price {
    font-size: 20px;
    font-weight: bold;
}

.category {
    display: inline-block;
    background: #e8fff7;
    color: #087f5b;
    padding: 6px 10px;
    border-radius: 15px;
    font-weight: bold;
}

.button {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
    text-align: center;
    text-decoration: none;
    font-size: 16px;
    cursor: pointer;
}

.details-button {
    background: #087f5b;
    color: white;
}

.favorite-button {
    background: #e91e63;
    color: white;
}

.contact-button {
    background: #1b8f3d;
    color: white;
}

.empty {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    grid-column: 1 / -1;
}

#error {
    color: red;
    text-align: center;
    margin-top: 20px;
}

#message {
    text-align: center;
    font-weight: bold;
    margin: 15px;
}

.loading {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    grid-column: 1 / -1;
}

.login-box {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    grid-column: 1 / -1;
}

.login-box a {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 20px;
    background: #087f5b;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

</style>

</head>


<body>


<nav>

<a href="index.html">Home</a>

<a href="products.html">Products</a>

<a href="post-products.html">Post Product</a>

<a href="favorites.html">Favorites</a>

<a href="my-products.html">My Products</a>

<a href="account.html">My Account</a>

</nav>


<div class="container">

<h1>
Products
</h1>


<p id="message"></p>


<div class="search-box">

<input
    type="text"
    id="searchInput"
    placeholder="Search for a product..."
>


<select id="categoryFilter">

<option value="all">
All Categories
</option>

<option value="Clothes">
Clothes
</option>

<option value="Shoes">
Shoes
</option>

<option value="Electronics">
Electronics
</option>

<option value="Phones">
Phones
</option>

<option value="Furniture">
Furniture
</option>

<option value="Other">
Other
</option>

</select>

</div>


<div id="productsContainer">

<div class="loading">
Loading products...
</div>

</div>


<p id="error"></p>

</div>


<script>


/* =================================
   SUPABASE CONNECTION
================================= */

const SUPABASE_URL =
    "https://zofngbuatccapcypmvkf.supabase.co";


/*
   IMPORTANT:
   Keep the SAME publishable key
   you were already using here.
*/

const SUPABASE_KEY =
    "sb_publishable_ifpnnnvmw3cOAaykROZPaA_4DZ8tDLh";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =================================
   ELEMENTS
================================= */

const productsContainer =
    document.getElementById(
        "productsContainer"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const categoryFilter =
    document.getElementById(
        "categoryFilter"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const message =
    document.getElementById(
        "message"
    );


/* =================================
   PRODUCTS
================================= */

let products = [];


/* =================================
   SUPABASE FAVORITES
================================= */

let favorites = [];

let currentUser = null;


/* =================================
   GET CURRENT USER
================================= */

async function getCurrentUser() {

    const {
        data,
        error
    } =
    await supabaseClient.auth.getUser();


    if (error) {

        console.error(
            "AUTH ERROR:",
            error
        );

        return null;
    }


    return data.user || null;

}


/* =================================
   LOAD USER FAVORITES
================================= */

async function loadFavorites() {

    currentUser =
        await getCurrentUser();


    if (!currentUser) {

        favorites = [];

        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("favorites")
        .select("product_id")
        .eq(
            "user_id",
            currentUser.id
        );


    if (error) {

        console.error(
            "LOAD FAVORITES ERROR:",
            error
        );

        favorites = [];

        return;
    }


    favorites =
        Array.isArray(data)
        ? data.map(
            function(row) {
                return String(
                    row.product_id
                );
            }
        )
        : [];

}


/* =================================
   LOAD PRODUCTS
================================= */

async function loadProducts() {

    productsContainer.innerHTML = `
        <div class="loading">
            Loading products...
        </div>
    `;


    errorBox.textContent = "";


    try {

        /*
           Load login first
        */

        await loadFavorites();


        /*
           Load products
        */

        const {
            data,
            error
        } =
        await supabaseClient
            .from("products")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            throw error;

        }


        products =
            Array.isArray(data)
            ? data
            : [];


        filterProducts();


    } catch (error) {

        console.error(
            "LOAD PRODUCTS ERROR:",
            error
        );


        productsContainer.innerHTML = `
            <div class="empty">

                <h2>
                    Could not load products
                </h2>

                <p>
                    Please try again.
                </p>

            </div>
        `;


        errorBox.textContent =
            error.message ||
            "Could not load products.";

    }

}


/* =================================
   DISPLAY PRODUCTS
================================= */

function displayProducts(list) {

    productsContainer.innerHTML = "";


    if (list.length === 0) {

        productsContainer.innerHTML = `

            <div class="empty">

                <h2>
                    No Products Found
                </h2>

                <p>
                    Try another search
                    or category.
                </p>

            </div>

        `;

        return;

    }


    list.forEach(
        function(product) {


            const productId =
                product.id;


            const isFavorite =
                favorites.some(
                    function(id) {

                        return String(id) ===
                            String(productId);

                    }
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product-card";


            card.innerHTML = `

                <img
                    src="${escapeHTML(
                        product.image_url || ""
                    )}"
                    alt="${escapeHTML(
                        product.name ||
                        "Product"
                    )}"
                >


                <div class="product-info">

                    <h2>
                        ${escapeHTML(
                            product.name ||
                            "Product"
                        )}
                    </h2>


                    <p class="price">
                        ${escapeHTML(
                            product.price ||
                            "Price not provided"
                        )}
                    </p>


                    <p>

                        <span class="category">
                            ${escapeHTML(
                                product.category ||
                                "Other"
                            )}
                        </span>

                    </p>


                    <p>
                        ${escapeHTML(
                            product.description ||
                            "No description available."
                        )}
                    </p>


                    <p>

                        <strong>
                            Seller:
                        </strong>

                        ${escapeHTML(
                            product.seller_name ||
                            "Not provided"
                        )}

                    </p>


                    <a
                        href="product-details.html?id=${encodeURIComponent(
                            productId
                        )}"
                        class="button details-button"
                    >
                        👁️ View Details
                    </a>


                    <button
                        type="button"
                        class="button favorite-button"
                    >
                        ${
                            isFavorite
                            ? "❤️ Remove Favorite"
                            : "♡ Add to Favorites"
                        }
                    </button>


                    ${
                        product.phone
                        ?
                        `
                        <a
                            href="tel:${encodeURIComponent(
                                product.phone
                            )}"
                            class="button contact-button"
                        >
                            📞 Contact Seller
                        </a>
                        `
                        :
                        ""
                    }

                </div>

            `;


            productsContainer.appendChild(
                card
            );


            /* =================================
               FAVORITE BUTTON
            ================================= */

            const favoriteButton =
                card.querySelector(
                    ".favorite-button"
                );


            favoriteButton.addEventListener(
                "click",
                async function() {

                    /*
                       LOGIN CHECK
                    */

                    if (!currentUser) {

                        message.textContent =
                            "Please login to save favorites.";

                        message.style.color =
                            "#d62828";

                        setTimeout(
                            function() {

                                window.location.href =
                                    "login.html";

                            },
                            1000
                        );

                        return;
                    }


                    /*
                       CHECK IF ALREADY FAVORITE
                    */

                    const alreadyFavorite =
                        favorites.some(
                            function(id) {

                                return String(id) ===
                                    String(productId);

                            }
                        );


                    favoriteButton.disabled =
                        true;


                    if (!alreadyFavorite) {

                        /*
                           ADD FAVORITE
                        */

                        const {
                            error: insertError
                        } =
                        await supabaseClient
                            .from("favorites")
                            .insert({

                                user_id:
                                    currentUser.id,

                                product_id:
                                    String(productId)

                            });


                        if (insertError) {

                            console.error(
                                "ADD FAVORITE ERROR:",
                                insertError
                            );


                            /*
                               Duplicate protection
                            */

                            if (
                                insertError.code ===
                                "23505"
                            ) {

                                favorites.push(
                                    String(
                                        productId
                                    )
                                );

                                favoriteButton.textContent =
                                    "❤️ Remove Favorite";

                            } else {

                                message.textContent =
                                    "Could not add favorite: " +
                                    insertError.message;

                                message.style.color =
                                    "red";

                            }


                        } else {

                            favorites.push(
                                String(
                                    productId
                                )
                            );


                            favoriteButton.textContent =
                                "❤️ Remove Favorite";


                            message.textContent =
                                "Added to favorites!";

                            message.style.color =
                                "#087f5b";

                        }


                    } else {

                        /*
                           REMOVE FAVORITE
                        */

                        const {
                            error: deleteError
                        } =
                        await supabaseClient
                            .from("favorites")
                            .delete()
                            .eq(
                                "user_id",
                                currentUser.id
                            )
                            .eq(
                                "product_id",
                                String(productId)
                            );


                        if (deleteError) {

                            console.error(
                                "REMOVE FAVORITE ERROR:",
                                deleteError
                            );


                            message.textContent =
                                "Could not remove favorite: " +
                                deleteError.message;

                            message.style.color =
                                "red";


                        } else {

                            favorites =
                                favorites.filter(
                                    function(id) {

                                        return String(id) !==
                                            String(productId);

                                    }
                                );


                            favoriteButton.textContent =
                                "♡ Add to Favorites";


                            message.textContent =
                                "Removed from favorites.";

                            message.style.color =
                                "#d62828";

                        }

                    }


                    favoriteButton.disabled =
                        false;

                }
            );

        }
    );

}


/* =================================
   SEARCH + FILTER
================================= */

function filterProducts() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const category =
        categoryFilter.value;


    const filtered =
        products.filter(
            function(product) {


                const name =
                    String(
                        product.name ||
                        ""
                    )
                    .toLowerCase();


                const description =
                    String(
                        product.description ||
                        ""
                    )
                    .toLowerCase();


                const productCategory =
                    String(
                        product.category ||
                        ""
                    );


                const matchesSearch =
                    name.includes(search) ||
                    description.includes(search);


                const matchesCategory =
                    category === "all" ||
                    productCategory === category;


                return (
                    matchesSearch &&
                    matchesCategory
                );

            }
        );


    displayProducts(
        filtered
    );

}


/* =================================
   HTML SAFETY
================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =================================
   EVENTS
================================= */

searchInput.addEventListener(
    "input",
    filterProducts
);


categoryFilter.addEventListener(
    "change",
    filterProducts
);


/* =================================
   START
================================= */

loadProducts();

</script>

</body>

</html>
