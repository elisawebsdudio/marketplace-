<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details - MarketPlace</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }

        nav {
            background: #087f5b;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 6px;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 700px;
            margin: 30px auto;
        }

        .product-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        .product-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 8px;
            background: #eee;
        }

        h1 {
            color: #087f5b;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
        }

        .category {
            display: inline-block;
            background: #e8fff7;
            color: #087f5b;
            padding: 7px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .seller-box {
            margin-top: 25px;
            padding: 18px;
            background: #e8fff7;
            border-radius: 8px;
        }

        .seller-box h2 {
            color: #087f5b;
            margin-top: 0;
        }

        .button {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
        }

        .contact-button {
            background: #087f5b;
            color: white;
        }

        .favorite-button {
            background: #e8fff7;
            color: #087f5b;
        }

        .favorite-button.saved {
            background: #087f5b;
            color: white;
        }

        .edit-button {
            background: #f4a261;
            color: white;
        }

        .delete-button {
            background: #d62828;
            color: white;
        }

        .back-button {
            background: #777;
            color: white;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .not-found {
            text-align: center;
        }

    </style>

</head>


<body>

    <nav>

        <a href="index.html">Home</a>

        <a href="products.html">Products</a>

        <a href="post-products.html">Post Product</a>

        <a href="favorites.html">Favorites</a>

        <a href="my-products.html">My Products</a>

        <a href="account.html">My Account</a>

    </nav>


    <div class="container">

        <div
            id="productContainer"
            class="product-box"
        ></div>

        <p id="message"></p>

    </div>


    <script>

        /* GET PRODUCT ID */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const id =
            params.get("id");


        const productContainer =
            document.getElementById(
                "productContainer"
            );

        const message =
            document.getElementById(
                "message"
            );


        /* GET PRODUCTS */

        function getProducts() {

            try {

                const saved =
                    localStorage.getItem(
                        "products"
                    );

                if (!saved) {
                    return [];
                }

                const products =
                    JSON.parse(saved);

                if (
                    !Array.isArray(products)
                ) {
                    return [];
                }

                return products;

            } catch (error) {

                return [];

            }

        }


        let products =
            getProducts();


        /* FIND PRODUCT */

        let productIndex = -1;


        if (id !== null) {

            /* First try product ID */

            productIndex =
                products.findIndex(
                    function(product) {

                        return String(
                            product.id
                        ) === String(id);

                    }
                );


            /*
             * If ID was actually an array
             * index, support that too.
             */

            if (
                productIndex === -1 &&
                !isNaN(Number(id))
            ) {

                const possibleIndex =
                    Number(id);

                if (
                    possibleIndex >= 0 &&
                    possibleIndex <
                    products.length
                ) {

                    productIndex =
                        possibleIndex;

                }

            }

        }


        const product =
            productIndex !== -1
                ? products[productIndex]
                : null;


        /* PRODUCT NOT FOUND */

        if (!product) {

            productContainer.innerHTML = `

                <div class="not-found">

                    <h2>
                        Product Not Found
                    </h2>

                    <p>
                        This product may have
                        been deleted.
                    </p>

                    <a
                        href="products.html"
                        class="button back-button"
                    >
                        Back to Products
                    </a>

                </div>

            `;

        } else {


            /* GET FAVORITES */

            let favorites = [];

            try {

                const savedFavorites =
                    localStorage.getItem(
                        "favorites"
                    );

                if (savedFavorites) {

                    favorites =
                        JSON.parse(
                            savedFavorites
                        );

                }

                if (
                    !Array.isArray(
                        favorites
                    )
                ) {

                    favorites = [];

                }

            } catch (error) {

                favorites = [];

            }


            /* FAVORITE STATUS */

            const favoriteId =
                product.id !== undefined
                    ? product.id
                    : productIndex;


            const isFavorite =
                favorites.some(
                    function(item) {

                        return String(item) ===
                            String(favoriteId);

                    }
                );


            /* DISPLAY PRODUCT */

            productContainer.innerHTML = `

                <img
                    src="${product.image || ""}"
                    alt="${product.name || "Product"}"
                    class="product-image"
                >


                <h1>
                    ${product.name || "Product"}
                </h1>


                <p class="price">
                    ${product.price || "Price not provided"}
                </p>


                <p>

                    <strong>
                        Category:
                    </strong>

                    <span class="category">
                        ${product.category || "Other"}
                    </span>

                </p>


                <h3>
                    Description
                </h3>


                <p>
                    ${product.description || "No description provided."}
                </p>


                <div class="seller-box">

                    <h2>
                        Seller Information
                    </h2>


                    <p>

                        <strong>
                            Name:
                        </strong>

                        ${product.sellerName || "Not provided"}

                    </p>


                    <p>

                        <strong>
                            Phone:
                        </strong>

                        ${product.phone || "Not provided"}

                    </p>


                    ${
                        product.phone
                        ?
                        `
                        <a
                            href="tel:${product.phone}"
                            class="button contact-button"
                        >
                            📞 Contact Seller
                        </a>
                        `
                        :
                        ""
                    }

                </div>


                <button
                    type="button"
                    id="favoriteButton"
                    class="button favorite-button ${isFavorite ? "saved" : ""}"
                >
                    ${
                        isFavorite
                        ? "❤️ Remove Favorite"
                        : "♡ Add to Favorites"
                    }
                </button>


                <a
                    href="edit-product.html?id=${product.id}"
                    class="button edit-button"
                >
                    ✏️ Edit Product
                </a>


                <button
                    type="button"
                    id="deleteButton"
                    class="button delete-button"
                >
                    🗑️ Delete Product
                </button>


                <a
                    href="products.html"
                    class="button back-button"
                >
                    ← Back to Products
                </a>

            `;


            /* FAVORITE BUTTON */

            const favoriteButton =
                document.getElementById(
                    "favoriteButton"
                );


            favoriteButton.addEventListener(
                "click",
                function() {

                    let currentFavorites = [];

                    try {

                        const saved =
                            localStorage.getItem(
                                "favorites"
                            );

                        if (saved) {

                            currentFavorites =
                                JSON.parse(
                                    saved
                                );

                            if (
                                !Array.isArray(
                                    currentFavorites
                                )
                            ) {

                                currentFavorites =
                                    [];

                            }

                        }

                    } catch (error) {

                        currentFavorites = [];

                    }


                    const position =
                        currentFavorites.findIndex(
                            function(item) {

                                return String(item) ===
                                    String(favoriteId);

                            }
                        );


                    if (position === -1) {

                        currentFavorites.push(
                            favoriteId
                        );

                        favoriteButton.textContent =
                            "❤️ Remove Favorite";

                        favoriteButton.classList.add(
                            "saved"
                        );

                        message.textContent =
                            "Added to Favorites!";

                        message.style.color =
                            "green";

                    } else {

                        currentFavorites.splice(
                            position,
                            1
                        );

                        favoriteButton.textContent =
                            "♡ Add to Favorites";

                        favoriteButton.classList.remove(
                            "saved"
                        );

                        message.textContent =
                            "Removed from Favorites.";

                        message.style.color =
                            "#087f5b";

                    }


                    localStorage.setItem(
                        "favorites",
                        JSON.stringify(
                            currentFavorites
                        )
                    );

                }
            );


            /* DELETE BUTTON */

            const deleteButton =
                document.getElementById(
                    "deleteButton"
                );


            deleteButton.addEventListener(
                "click",
                function() {

                    const answer =
                        window.confirm(
                            "Are you sure you want to delete this product?"
                        );


                    if (!answer) {

                        return;

                    }


                    products.splice(
                        productIndex,
                        1
                    );


                    try {

                        localStorage.setItem(
                            "products",
                            JSON.stringify(
                                products
                            )
                        );


                        message.textContent =
                            "Product deleted successfully!";

                        message.style.color =
                            "green";


                        setTimeout(
                            function() {

                                window.location.href =
                                    "my-products.html";

                            },
                            700
                        );

                    } catch (error) {

                        message.textContent =
                            "Could not delete product.";

                        message.style.color =
                            "red";

                    }

                }
            );

        }

    </script>

</body>

</html>
