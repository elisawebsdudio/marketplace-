<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #222;
        }

        header {
            background: #0f5132;
            color: white;
            padding: 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 700px;
            margin: 25px auto;
            padding: 15px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .product-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 12px;
            background: #f1f1f1;
            margin-bottom: 20px;
        }

        .product-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            color: #0f5132;
            margin-bottom: 15px;
        }

        .category {
            display: inline-block;
            background: #e2f3ea;
            color: #0f5132;
            padding: 7px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .section {
            border-top: 1px solid #ddd;
            padding-top: 18px;
            margin-top: 18px;
        }

        .section h3 {
            margin-top: 0;
            color: #0f5132;
        }

        .description {
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .seller-info {
            line-height: 1.8;
        }

        /* ==============================
           CONTACT BUTTONS
        ============================== */

        .contact-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .contact-button {
            flex: 1;
            padding: 13px;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .call-button {
            background: #0f5132;
        }

        .call-button:hover {
            background: #0b3d26;
        }

        .email-button {
            background: #2563eb;
        }

        .email-button:hover {
            background: #1d4ed8;
        }

        .back-button {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #0f5132;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            font-size: 16px;
        }

        .back-button:hover {
            background: #0b3d26;
        }

        .message {
            text-align: center;
            padding: 40px 15px;
            font-size: 18px;
        }

        .error {
            color: #b00020;
        }

        @media (max-width: 600px) {

            .container {
                margin: 15px auto;
            }

            .product-card {
                padding: 15px;
            }

            .product-name {
                font-size: 24px;
            }

            .contact-buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

    <header>

        <h1>Product Details</h1>

    </header>


    <div class="container">

        <div
            id="message"
            class="message"
        >
            Loading product...
        </div>


        <div
            id="productCard"
            class="product-card"
            style="display:none;"
        >

            <!-- PRODUCT IMAGE -->

            <img
                id="productImage"
                class="product-image"
                alt="Product image"
            >


            <!-- PRODUCT NAME -->

            <div
                id="productName"
                class="product-name"
            ></div>


            <!-- PRICE -->

            <div
                id="productPrice"
                class="price"
            ></div>


            <!-- CATEGORY -->

            <div
                id="productCategory"
                class="category"
            ></div>


            <!-- DESCRIPTION -->

            <div class="section">

                <h3>Description</h3>

                <div
                    id="productDescription"
                    class="description"
                ></div>

            </div>


            <!-- SELLER INFORMATION -->

            <div class="section">

                <h3>Seller Information</h3>

                <div class="seller-info">

                    <div>
                        <strong>Seller:</strong>
                        <span id="sellerName"></span>
                    </div>

                    <div>
                        <strong>Phone:</strong>
                        <span id="sellerPhone"></span>
                    </div>

                    <div>
                        <strong>Email:</strong>
                        <span id="sellerEmail"></span>
                    </div>

                </div>

            </div>


            <!-- CONTACT SELLER -->

            <div
                id="contactButtons"
                class="contact-buttons"
            >

                <a
                    id="callSeller"
                    class="contact-button call-button"
                >
                    📞 Call Seller
                </a>


                <a
                    id="emailSeller"
                    class="contact-button email-button"
                >
                    ✉️ Email Seller
                </a>

            </div>


            <!-- BACK BUTTON -->

            <a
                href="products.html"
                class="back-button"
            >
                ← Back to Products
            </a>

        </div>

    </div>



    <script>

        // ==============================
        // SUPABASE CONNECTION
        // ==============================

        const SUPABASE_URL =
            "https://zofngbuatccapcypmvkf.supabase.co";


        // ADD YOUR SUPABASE PUBLISHABLE KEY HERE

        const SUPABASE_KEY =
            "sb_publishable_ifpnnnvmw3cOAaykROZPaA_4DZ8tDLh";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // ==============================
        // GET PRODUCT ID FROM URL
        // ==============================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const productId =
            params.get("id");



        // ==============================
        // LOAD PRODUCT
        // ==============================

        async function loadProduct() {

            const message =
                document.getElementById("message");


            const productCard =
                document.getElementById("productCard");


            // Check product ID

            if (!productId) {

                message.innerHTML =
                    "Product ID was not found.";

                message.classList.add("error");

                return;
            }



            try {

                // ==============================
                // GET PRODUCT FROM SUPABASE
                // ==============================

                const { data, error } =
                    await supabaseClient

                        .from("products")

                        .select("*")

                        .eq("id", productId)

                        .single();



                if (error) {

                    throw error;

                }



                if (!data) {

                    message.innerHTML =
                        "Product not found.";

                    message.classList.add("error");

                    return;
                }



                // ==============================
                // DISPLAY PRODUCT
                // ==============================

                document
                    .getElementById("productName")
                    .textContent =
                    data.name ||
                    "Unnamed product";



                document
                    .getElementById("productPrice")
                    .textContent =
                    data.price
                        ? "Price: " + data.price
                        : "Price not available";



                document
                    .getElementById("productCategory")
                    .textContent =
                    data.category ||
                    "Uncategorized";



                document
                    .getElementById("productDescription")
                    .textContent =
                    data.description ||
                    "No description provided.";



                // ==============================
                // SELLER INFORMATION
                // ==============================

                document
                    .getElementById("sellerName")
                    .textContent =
                    data.seller_name ||
                    "Not provided";



                document
                    .getElementById("sellerPhone")
                    .textContent =
                    data.phone ||
                    "Not provided";



                document
                    .getElementById("sellerEmail")
                    .textContent =
                    data.seller_email ||
                    "Not provided";



                // ==============================
                // PRODUCT IMAGE
                // ==============================

                const image =
                    document.getElementById(
                        "productImage"
                    );



                if (data.image_url) {

                    image.src =
                        data.image_url;

                    image.style.display =
                        "block";

                } else {

                    image.style.display =
                        "none";

                }



                // ==============================
                // CONTACT SELLER BUTTONS
                // ==============================

                const callButton =
                    document.getElementById(
                        "callSeller"
                    );


                const emailButton =
                    document.getElementById(
                        "emailSeller"
                    );


                // CALL BUTTON

                if (data.phone) {

                    callButton.href =
                        "tel:" + data.phone;

                } else {

                    callButton.style.display =
                        "none";

                }



                // EMAIL BUTTON

                if (data.seller_email) {

                    emailButton.href =
                        "mailto:" +
                        data.seller_email;

                } else {

                    emailButton.style.display =
                        "none";

                }



                // ==============================
                // SHOW PRODUCT
                // ==============================

                message.style.display =
                    "none";


                productCard.style.display =
                    "block";



            } catch (error) {

                console.error(
                    "PRODUCT ERROR:",
                    error
                );


                message.innerHTML =
                    "Could not load this product.";


                message.classList.add(
                    "error"
                );

            }

        }



        // ==============================
        // START
        // ==============================

        loadProduct();

    </script>

</body>

    </html>
