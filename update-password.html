<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Update Password - MarketPlace</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }

        nav {
            background: #087f5b;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 6px;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 430px;
            margin: 50px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #087f5b;
            margin-top: 0;
        }

        .description {
            text-align: center;
            color: #555;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        .input-box {
            position: relative;
            margin-top: 7px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .eye-button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 35px;
            height: 35px;
            padding: 0;
            background: transparent;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }

        .eye-button:hover {
            background: #f0f0f0;
        }

        .update-button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-button:hover {
            background: #066b4d;
        }

        .update-button:disabled {
            background: #7aa99a;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #087f5b;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

</head>


<body>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>


    <div class="container">

        <div class="box">

            <h1>
                Set New Password
            </h1>


            <p class="description">
                Enter a new password for your MarketPlace account.
            </p>


            <form id="passwordForm">

                <label for="password">
                    New Password
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="eye-button"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>


                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        id="toggleConfirmPassword"
                        class="eye-button"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>


                <button
                    type="submit"
                    id="updateButton"
                    class="update-button"
                >
                    Update Password
                </button>

            </form>


            <p id="message"></p>


            <a
                href="login.html"
                class="back-link"
            >
                ← Back to Login
            </a>

        </div>

    </div>



    <script>

        // ==============================
        // SUPABASE CONNECTION
        // ==============================

        const SUPABASE_URL =
            "https://zofngbuatccapcypmvkf.supabase.co";


        // ADD YOUR EXISTING PUBLISHABLE KEY HERE

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_ifpnnnvmw3cOAaykROZPaA_4DZ8tDLh";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // ==============================
        // ELEMENTS
        // ==============================

        const passwordForm =
            document.getElementById(
                "passwordForm"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );

        const togglePassword =
            document.getElementById(
                "togglePassword"
            );

        const toggleConfirmPassword =
            document.getElementById(
                "toggleConfirmPassword"
            );

        const updateButton =
            document.getElementById(
                "updateButton"
            );

        const message =
            document.getElementById(
                "message"
            );


        // ==============================
        // SHOW / HIDE PASSWORD
        // ==============================

        togglePassword.addEventListener(
            "click",
            function() {

                if (
                    passwordInput.type === "password"
                ) {

                    passwordInput.type = "text";

                    togglePassword.textContent =
                        "🙈";

                } else {

                    passwordInput.type = "password";

                    togglePassword.textContent =
                        "👁️";

                }

            }
        );


        toggleConfirmPassword.addEventListener(
            "click",
            function() {

                if (
                    confirmPasswordInput.type === "password"
                ) {

                    confirmPasswordInput.type = "text";

                    toggleConfirmPassword.textContent =
                        "🙈";

                } else {

                    confirmPasswordInput.type =
                        "password";

                    toggleConfirmPassword.textContent =
                        "👁️";

                }

            }
        );


        // ==============================
        // UPDATE PASSWORD
        // ==============================

        passwordForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                message.textContent = "";


                // CHECK PASSWORD MATCH

                if (
                    password !== confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color =
                        "red";

                    return;
                }


                updateButton.disabled = true;

                updateButton.textContent =
                    "Updating...";


                try {

                    // ==============================
                    // UPDATE SUPABASE PASSWORD
                    // ==============================

                    const { error } =
                        await supabaseClient.auth
                            .updateUser({
                                password: password
                            });


                    if (error) {

                        throw error;

                    }


                    message.textContent =
                        "Password updated successfully!";

                    message.style.color =
                        "green";


                    passwordForm.reset();


                    setTimeout(
                        function() {

                            window.location.href =
                                "login.html";

                        },
                        1500
                    );


                } catch (error) {

                    console.error(
                        "PASSWORD UPDATE ERROR:",
                        error
                    );


                    message.textContent =
                        error.message ||
                        "Could not update password.";

                    message.style.color =
                        "red";

                } finally {

                    updateButton.disabled =
                        false;

                    updateButton.textContent =
                        "Update Password";

                }

            }
        );

    </script>

</body>

                      </html>
