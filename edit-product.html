<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Product - MarketPlace</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }

        nav {
            background: #087f5b;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 7px;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 600px;
            background: white;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #087f5b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        #currentImage {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 8px;
            background: #eee;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .save-button {
            background: #087f5b;
            color: white;
        }

        .back-button {
            background: #777;
            color: white;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .error-box {
            text-align: center;
            padding: 20px;

        .error-box a {

            font-weight: bold;

</head>


<body>


    <nav>

        <a href="index.html">Home</a>

        <a href="products.html">Products</a>

        <a href="post-products.html">Post Product</a>

        <a href="my-products.html">My Products</a>

        <a href="account.html">My Account</a>

    </nav>


    <div class="container">

        <h1>
            Edit Product
        </h1>


        <div id="message"></div>


        <form id="editForm">

            <label for="productName">
                Product Name
            </label>

            <input
                type="text"
                id="productName"
                required
            >


            <label for="price">
                Price
            </label>

            <input
                type="text"
                id="price"
                required
            >


            <label for="category">
                Category
            </label>

            <select
                id="category"
                required
            >

                <option value="">
                    Select category
                </option>

                <option value="Clothes">
                    Clothes
                </option>

                <option value="Shoes">
                    Shoes
                </option>

                <option value="Electronics">
                    Electronics
                </option>

                <option value="Phones">
                    Phones
                </option>

                <option value="Furniture">
                    Furniture
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label for="image">
                Change Product Image
            </label>

            <input
                type="file"
                id="image"
                accept="image/*"
            >


            <img
                id="currentImage"
                alt="Current Product Image"
            >


            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                required
            ></textarea>


            <label for="sellerName">
                Seller Name
            </label>

            <input
                type="text"
                id="sellerName"
                required
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                required
            >


            <button
                type="submit"
                class="save-button"
                id="saveButton"
            >
                Save Changes
            </button>


            <button
                type="button"
                class="back-button"
                id="backButton"
            >
                Cancel
            </button>

        </form>

    </div>


<script>


/* =================================
   SUPABASE CONNECTION
================================= */

const SUPABASE_URL =
    "https://zofngbuatccapcypmvkf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ifpnnnvmw3cOAaykROZPaA_4DZ8tDLh";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =================================
   PAGE ELEMENTS
================================= */

const form =
    document.getElementById("editForm");

const message =
    document.getElementById("message");

const currentImage =
    document.getElementById("currentImage");

const imageInput =
    document.getElementById("image");

const saveButton =
    document.getElementById("saveButton");


/* =================================
   GET PRODUCT ID
================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const productId =
    params.get("id");


/* =================================
   CURRENT PRODUCT
================================= */

let currentProduct = null;


/* =================================
   LOAD PRODUCT
================================= */

async function loadProduct() {

    if (!productId) {

        showError(
            "Product Not Found",
            "No product ID was provided."
        );

        return;
    }


    /* ==============================
       CHECK USER
    ============================== */

    const {
        data: {
            user
        },
        error: userError
    } = await supabaseClient.auth.getUser();


    if (
        userError ||
        !user
    ) {

        form.style.display = "none";

        showError(
            "Login Required",
            "Please login before editing a product."
        );

        return;
    }


    /* ==============================
       GET PRODUCT
    ============================== */

    const {
        data: product,
        error
    } = await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .single();


    if (error || !product) {

    form.style.display = "none";

    showError(
        "Could Not Load Product",
        error
            ? error.message
            : "The product was not found in the database."
    );

    console.error("Supabase error:", error);

    return;
    }


    /* ==============================
       CHECK SELLER
    ============================== */

    if (
        String(product.seller_email || "")
            .trim()
            .toLowerCase() !==
        String(user.email || "")
            .trim()
            .toLowerCase()
    ) {

        form.style.display = "none";

        showError(
            "Access Denied",
            "You can only edit your own products."
        );

        return;
    }


    /* ==============================
       SAVE CURRENT PRODUCT
    ============================== */

    currentProduct =
        product;


    /* ==============================
       FILL FORM
    ============================== */

    document
        .getElementById("productName")
        .value =
            product.name || "";


    document
        .getElementById("price")
        .value =
            product.price || "";


    document
        .getElementById("category")
        .value =
            product.category || "";


    document
        .getElementById("description")
        .value =
            product.description || "";


    document
        .getElementById("sellerName")
        .value =
            product.seller_name || "";


    document
        .getElementById("phone")
        .value =
            product.phone || "";


    if (product.image_url) {

        currentImage.src =
            product.image_url;

    } else {

        currentImage.style.display =
            "none";

    }

}


/* =================================
   SHOW ERROR
================================= */

function showError(
    title,
    text
) {

    message.innerHTML = `

        <div class="error-box">

            <h2>
                ${title}
            </h2>

            <p>
                ${text}
            </p>

            <a href="my-products.html">
                Back to My Products
            </a>

        </div>

    `;

}
