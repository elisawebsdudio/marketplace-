<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - MarketPlace</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }

        nav {
            background: #087f5b;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 6px;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 430px;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #087f5b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="input"] {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-weight: normal;
            cursor: pointer;
        }

        .show-password input {
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #066b4d;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #087f5b;
            font-weight: bold;
            text-decoration: none;
        }

    </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>


    <nav>

        <a href="index.html">Home</a>

        <a href="products.html">Products</a>

        <a href="login.html">Login</a>

        <a href="register.html">Register</a>

    </nav>


    <div class="container">

        <div class="box">

            <h1>
                Create Account
            </h1>


            <form id="registerForm">


                <!-- FULL NAME -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >


                <label
                    class="show-password"
                    for="showPassword"
                >

                    <input
                        type="checkbox"
                        id="showPassword"
                    >

                    Show password

                </label>


                <!-- CONFIRM PASSWORD -->

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >


                <label
                    class="show-password"
                    for="showConfirmPassword"
                >

                    <input
                        type="checkbox"
                        id="showConfirmPassword"
                    >

                    Show password

                </label>


                <!-- REGISTER BUTTON -->

                <button type="submit">
                    Register
                </button>

            </form>


            <p id="message"></p>


            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script>


        /* =========================
           GET ELEMENTS
        ========================= */

        const form =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const showPassword =
            document.getElementById("showPassword");

        const showConfirmPassword =
            document.getElementById("showConfirmPassword");


        /* =========================
           SHOW PASSWORD
        ========================= */

        showPassword.addEventListener(
            "click",
            function() {

                if (showPassword.checked) {

                    passwordInput.type = "text";

                } else {

                    passwordInput.type = "password";

                }

            }
        );


        /* =========================
           SHOW CONFIRM PASSWORD
        ========================= */

        showConfirmPassword.addEventListener(
            "click",
            function() {

                if (showConfirmPassword.checked) {

                    confirmPasswordInput.type = "text";

                } else {

                    confirmPasswordInput.type = "password";

                }

            }
        );


        /* =========================
           REGISTER ACCOUNT
        ========================= */

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const name =
                    document.getElementById("name")
                    .value
                    .trim();


                const email =
                    document.getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


                const password =
                    passwordInput.value;


                const confirmPassword =
                    confirmPasswordInput.value;


                /* CHECK PASSWORDS */

                if (
                    password !== confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color =
                        "red";

                    return;

                }


                /* GET EXISTING USERS */

                let users = [];


                try {

                    const savedUsers =
                        localStorage.getItem("users");


                    if (savedUsers) {

                        users =
                            JSON.parse(savedUsers);

                    }


                    if (
                        !Array.isArray(users)
                    ) {

                        users = [];

                    }

                } catch (error) {

                    users = [];

                }


                /* CHECK EMAIL */

                const exists =
                    users.some(
                        function(user) {

                            return (
                                String(
                                    user.email || ""
                                )
                                .toLowerCase() ===
                                email
                            );

                        }
                    );


                if (exists) {

                    message.textContent =
                        "This email is already registered.";

                    message.style.color =
                        "red";

                    return;

                }


                /* CREATE USER */

                const newUser = {

                    id: Date.now(),

                    name: name,

                    email: email,

                    password: password

                };


                users.push(newUser);


                /* SAVE USERS */

                try {

                    localStorage.setItem(
                        "users",
                        JSON.stringify(users)
                    );

                } catch (error) {

                    message.textContent =
                        "Could not create account.";

                    message.style.color =
                        "red";

                    return;

                }


                /* SUCCESS MESSAGE */

                message.textContent =
                    "Registration successful!";

                message.style.color =
                    "green";


                /* CLEAR FORM */

                form.reset();


                /* RETURN PASSWORD FIELDS TO HIDDEN */

                passwordInput.type =
                    "password";

                confirmPasswordInput.type =
                    "password";


                /* GO TO LOGIN */

                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    1000
                );

            }
        );


    </script>


</body>

</html>
