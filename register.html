<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - MarketPlace</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }

        nav {
            background: #087f5b;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 6px;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 430px;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #087f5b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        .input-box {
            position: relative;
            margin-top: 7px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .normal-input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .eye-button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);

            width: 35px;
            height: 35px;

            padding: 0;
            margin: 0;

            background: transparent;
            color: #555;

            border: none;
            border-radius: 50%;

            font-size: 18px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-button:hover {
            background: #f0f0f0;
            color: #087f5b;
        }

        .register-button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .register-button:hover {
            background: #066b4d;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #087f5b;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="login.html">
            Login
        </a>

        <a href="register.html">
            Register
        </a>

    </nav>


    <div class="container">

        <div class="box">

            <h1>
                Create Account
            </h1>


            <form id="registerForm">


                <!-- NAME -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    class="normal-input"
                    placeholder="Enter your full name"
                    required
                >


                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    class="normal-input"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="eye-button"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>


                <!-- CONFIRM PASSWORD -->

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="eye-button"
                        id="toggleConfirmPassword"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>


                <!-- REGISTER -->

                <button
                    type="submit"
                    class="register-button"
                    id="registerButton"
                >
                    Register
                </button>


            </form>


            <p id="message"></p>


            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script>

        /* =========================
           SUPABASE CONNECTION
        ========================= */

        const SUPABASE_URL =
            "https://zofngbuatccapcypmvkf.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_ifpnnnvmw3cOAaykROZPaA_4DZ8tDLh";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================
           ELEMENTS
        ========================= */

        const form =
            document.getElementById(
                "registerForm"
            );

        const message =
            document.getElementById(
                "message"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );

        const togglePassword =
            document.getElementById(
                "togglePassword"
            );

        const toggleConfirmPassword =
            document.getElementById(
                "toggleConfirmPassword"
            );

        const registerButton =
            document.getElementById(
                "registerButton"
            );


        /* =========================
           PASSWORD EYE
        ========================= */

        togglePassword.addEventListener(
            "click",
            function() {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    togglePassword.textContent =
                        "🙈";

                } else {

                    passwordInput.type =
                        "password";

                    togglePassword.textContent =
                        "👁️";

                }

            }
        );


        toggleConfirmPassword.addEventListener(
            "click",
            function() {

                if (
                    confirmPasswordInput.type ===
                    "password"
                ) {

                    confirmPasswordInput.type =
                        "text";

                    toggleConfirmPassword.textContent =
                        "🙈";

                } else {

                    confirmPasswordInput.type =
                        "password";

                    toggleConfirmPassword.textContent =
                        "👁️";

                }

            }
        );


        /* =========================
           REGISTER
        ========================= */

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "name"
                    )
                    .value
                    .trim();


                const email =
                    document.getElementById(
                        "email"
                    )
                    .value
                    .trim()
                    .toLowerCase();


                const password =
                    passwordInput.value;


                const confirmPassword =
                    confirmPasswordInput.value;


                /* CHECK PASSWORD */

                if (
                    password !==
                    confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color =
                        "red";

                    return;

                }


                if (
                    password.length < 6
                ) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    message.style.color =
                        "red";

                    return;

                }


                /* DISABLE BUTTON */

                registerButton.disabled =
                    true;

                registerButton.textContent =
                    "Creating account...";


                try {

                    /* CREATE SUPABASE USER */

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth.signUp({

                            email:
                                email,

                            password:
                                password,

                            options: {

                                data: {

                                    name:
                                        name

                                }

                            }

                        });


                    if (error) {

                        message.textContent =
                            error.message;

                        message.style.color =
                            "red";

                        return;

                    }


                    /* SUCCESS */

                    message.textContent =
                        "Account created successfully! Check your email to confirm your account.";

                    message.style.color =
                        "green";


                    form.reset();


                    passwordInput.type =
                        "password";

                    confirmPasswordInput.type =
                        "password";

                    togglePassword.textContent =
                        "👁️";

                    toggleConfirmPassword.textContent =
                        "👁️";


                    /* GO TO LOGIN */

                    setTimeout(
                        function() {

                            window.location.href =
                                "login.html";

                        },
                        2500
                    );


                } catch (error) {

                    message.textContent =
                        "Something went wrong. Please try again.";

                    message.style.color =
                        "red";

                } finally {

                    registerButton.disabled =
                        false;

                    registerButton.textContent =
                        "Register";

                }

            }
        );

    </script>


</body>

</html>
