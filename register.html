<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - MarketPlace</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }

        nav {
            background: #087f5b;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 6px;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 430px;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #087f5b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #066b4d;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #087f5b;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

</head>


<body>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="login.html">
            Login
        </a>

        <a href="register.html">
            Register
        </a>

    </nav>


    <div class="container">

        <div class="box">

            <h1>
                Create Account
            </h1>


            <form id="registerForm">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >


                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >


                <button type="submit">
                    Register
                </button>

            </form>


            <p id="message"></p>


            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script>

        const form =
            document.getElementById(
                "registerForm"
            );

        const message =
            document.getElementById(
                "message"
            );


        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "name"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim()
                    .toLowerCase();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                /* CHECK PASSWORD */

                if (
                    password !==
                    confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color =
                        "red";

                    return;

                }


                /* GET USERS */

                let users = [];

                try {

                    const savedUsers =
                        localStorage.getItem(
                            "users"
                        );

                    if (savedUsers) {

                        users =
                            JSON.parse(
                                savedUsers
                            );

                    }

                    if (!Array.isArray(users)) {

                        users = [];

                    }

                } catch (error) {

                    users = [];

                }


                /* CHECK EMAIL */

                const exists =
                    users.some(
                        function(user) {

                            return (
                                String(
                                    user.email || ""
                                ).toLowerCase() ===
                                email
                            );

                        }
                    );


                if (exists) {

                    message.textContent =
                        "This email is already registered.";

                    message.style.color =
                        "red";

                    return;

                }


                /* CREATE USER */

                const newUser = {

                    id:
                        Date.now(),

                    name:
                        name,

                    email:
                        email,

                    password:
                        password

                };


                users.push(
                    newUser
                );


                /* SAVE */

                localStorage.setItem(
                    "users",
                    JSON.stringify(
                        users
                    )
                );


                /* SUCCESS */

                message.textContent =
                    "Registration successful!";

                message.style.color =
                    "green";


                form.reset();


                /* GO TO LOGIN */

                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    1000
                );

            }
        );

    </script>

</body>

</html>
