<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MarketPlace | Buy & Sell</title>

<style>

/* =========================
   BASIC RESET
========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f6;
    color: #222;
}


/* =========================
   NAVIGATION
========================= */

nav {
    background: #087f5b;
    padding: 14px 10px;

    display: flex;
    justify-content: center;
    align-items: center;

    flex-wrap: wrap;
    gap: 5px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

nav a {
    color: white;
    text-decoration: none;

    padding: 9px 10px;

    font-weight: bold;
    font-size: 14px;

    border-radius: 6px;
}

nav a:hover {
    background: rgba(255,255,255,0.15);
}


/* =========================
   HERO
========================= */

.hero {
    text-align: center;

    padding: 65px 20px 55px;

    background:
        linear-gradient(
            135deg,
            #e8fff7,
            #ffffff
        );
}

.hero h1 {
    color: #087f5b;

    font-size: clamp(
        30px,
        7vw,
        46px
    );

    margin: 0 0 15px;
}

.hero p {
    max-width: 650px;

    margin: 0 auto 25px;

    font-size: 18px;
    line-height: 1.6;

    color: #555;
}


/* =========================
   BUTTONS
========================= */

.button {
    display: inline-block;

    background: #087f5b;
    color: white;

    padding: 13px 22px;

    text-decoration: none;

    border-radius: 7px;

    margin: 6px;

    font-weight: bold;

    transition:
        transform 0.2s,
        background 0.2s;
}

.button:hover {
    background: #066b4d;

    transform: translateY(-2px);
}


/* =========================
   SEARCH
========================= */

.search-section {
    width: 92%;
    max-width: 800px;

    margin: 35px auto 25px;

    text-align: center;
}

.search-section h2 {
    color: #087f5b;

    margin-bottom: 15px;
}

#searchInput {
    width: 100%;

    padding: 15px 17px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;

    outline: none;
}

#searchInput:focus {
    border-color: #087f5b;

    box-shadow:
        0 0 0 3px
        rgba(8,127,91,0.12);
}


/* =========================
   CATEGORIES
========================= */

.categories {
    width: 92%;
    max-width: 900px;

    margin: 30px auto;

    text-align: center;
}

.categories h2 {
    color: #087f5b;

    margin-bottom: 15px;
}

.category-button {
    border: none;

    background: white;

    padding: 12px 18px;

    margin: 5px;

    border-radius: 25px;

    cursor: pointer;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.10);

    font-size: 15px;

    transition:
        transform 0.2s,
        background 0.2s;
}

.category-button:hover {
    background: #e8fff7;

    transform: translateY(-2px);
}


/* =========================
   LATEST PRODUCTS
========================= */

.latest {
    width: 92%;
    max-width: 1100px;

    margin: 50px auto;
}

.latest h2 {
    text-align: center;

    color: #087f5b;

    margin-bottom: 25px;
}

#latestProducts {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px, 1fr)
        );

    gap: 20px;
}


/* =========================
   PRODUCT CARD
========================= */

.product-card {
    background: white;

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.10);

    cursor: pointer;

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}

.product-card:hover {
    transform: translateY(-4px);

    box-shadow:
        0 7px 20px
        rgba(0,0,0,0.15);
}

.product-card img {
    width: 100%;

    height: 200px;

    object-fit: cover;

    background: #eee;

    display: block;
}

.product-info {
    padding: 17px;
}

.product-info h3 {
    color: #087f5b;

    margin: 0 0 10px;

    font-size: 19px;
}

.price {
    font-weight: bold;

    font-size: 18px;

    margin: 8px 0;
}


/* =========================
   NO PRODUCTS
========================= */

.no-products {
    text-align: center;

    padding: 30px;

    background: white;

    border-radius: 10px;

    grid-column: 1 / -1;
}

.no-products h3 {
    color: #087f5b;
}


/* =========================
   VIEW ALL
========================= */

.view-all {
    text-align: center;

    margin-top: 30px;
}


/* =========================
   FOOTER
========================= */

footer {
    text-align: center;

    background: #222;

    color: white;

    padding: 25px 15px;

    margin-top: 60px;
}

footer p {
    margin: 5px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    nav {
        padding: 10px 5px;
    }

    nav a {
        font-size: 13px;

        padding: 8px 7px;
    }

    .hero {
        padding: 50px 15px;
    }

    .hero p {
        font-size: 16px;
    }

    .button {
        display: block;

        width: 100%;

        max-width: 320px;

        margin: 9px auto;
    }

    #latestProducts {
        grid-template-columns: 1fr;
    }

    .product-card img {
        height: 230px;
    }

    .category-button {
        font-size: 14px;

        padding: 10px 14px;
    }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 380px) {

    nav a {
        font-size: 12px;

        padding: 7px 5px;
    }

    .hero h1 {
        font-size: 30px;
    }

}

</style>

</head>
