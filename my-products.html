<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Products - MarketPlace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f6;
}

nav {
    background: #087f5b;
    padding: 12px 5px;
    text-align: center;

    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;

    gap: 5px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;

    padding: 7px 6px;

    border-radius: 5px;

    white-space: nowrap;

    display: inline-block;
}

nav a:hover {
    background: rgba(255,255,255,0.15);
}

@media (max-width: 500px) {

    nav {
        gap: 3px;
        padding: 10px 3px;
    }

    nav a {
        font-size: 12px;
        padding: 6px 5px;
    }

}

.container {
    width: 94%;
    max-width: 1100px;
    margin: 30px auto;
}

h1 {
    text-align: center;
    color: #087f5b;
}

.welcome {
    text-align: center;
    margin-bottom: 25px;
}

#productsContainer {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.product-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

.product-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    background: #eee;
}

.product-info {
    padding: 18px;
}

.product-info h2 {
    color: #087f5b;
    margin-top: 0;
}

.price {
    font-size: 20px;
    font-weight: bold;
}

.category {
    display: inline-block;
    background: #e8fff7;
    color: #087f5b;
    padding: 6px 10px;
    border-radius: 15px;
    font-weight: bold;
}

.button {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
    text-align: center;
    text-decoration: none;
    font-size: 16px;
    cursor: pointer;
}

.details-button {
    background: #087f5b;
    color: white;
}

.edit-button {
    background: #f4a261;
    color: white;
}

.delete-button {
    background: #d62828;
    color: white;
}

.empty {
    background: white;
    padding: 35px;
    text-align: center;
    border-radius: 10px;
    grid-column: 1 / -1;
}

.empty a {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 20px;
    background: #087f5b;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

#message {
    text-align: center;
    margin: 15px 0;
    font-weight: bold;
}


/* DELETE POPUP */

.modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-box {
    width: 100%;
    max-width: 400px;
    background: white;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px 25px rgba(0,0,0,0.3);
}

.modal-box h2 {
    color: #d62828;
    margin-top: 0;
}

.modal-box p {
    color: #444;
    line-height: 1.5;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modal-buttons button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.cancel-delete {
    background: #777;
    color: white;
}

.confirm-delete {
    background: #d62828;
    color: white;
}

</style>

</head>


<body>


<nav>

<a href="index.html">Home</a>

<a href="products.html">Products</a>

<a href="post-products.html">Post Product</a>

<a href="favorites.html">Favorites</a>

<a href="my-products.html">My Products</a>

<a href="account.html">My Account</a>

</nav>


<div class="container">

<h1>
My Products
</h1>

<p
id="welcome"
class="welcome"
></p>

<p id="message"></p>

<div id="productsContainer"></div>

</div>


<!-- DELETE POPUP -->

<div
    id="deleteModal"
    class="modal"
>

    <div class="modal-box">

        <h2>
            Delete Product?
        </h2>

        <p>
            Are you sure you want to
            delete this product?
        </p>

        <div class="modal-buttons">

            <button
                type="button"
                id="cancelDelete"
                class="cancel-delete"
            >
                Cancel
            </button>

            <button
                type="button"
                id="confirmDelete"
                class="confirm-delete"
            >
                Yes, Delete
            </button>

        </div>

    </div>

</div>


<script>

/* =================================
   SUPABASE CONNECTION
================================= */

const SUPABASE_URL =
    "https://zofngbuatccapcypmvkf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ifpnnnvmw3cOAaykROZPaA_4DZ8tDLh";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =================================
   PAGE ELEMENTS
================================= */

const productsContainer =
    document.getElementById(
        "productsContainer"
    );

const welcome =
    document.getElementById(
        "welcome"
    );

const message =
    document.getElementById(
        "message"
    );

const deleteModal =
    document.getElementById(
        "deleteModal"
    );

const cancelDelete =
    document.getElementById(
        "cancelDelete"
    );

const confirmDelete =
    document.getElementById(
        "confirmDelete"
    );


/* =================================
   SELECTED PRODUCT
================================= */

let selectedProductId = null;


/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =================================
   LOAD MY PRODUCTS
================================= */

async function loadMyProducts() {

    productsContainer.innerHTML = "";

    message.textContent = "";


    /* ==============================
       CHECK SUPABASE LOGIN
    ============================== */

    const {
        data: {
            user
        },
        error: userError
    } = await supabaseClient.auth.getUser();


    if (
        userError ||
        !user
    ) {

        productsContainer.innerHTML = `

            <div class="empty">

                <h2>
                    Login Required
                </h2>

                <p>
                    Please login before
                    viewing your products.
                </p>

                <a href="login.html">
                    Login
                </a>

            </div>

        `;

        return;
    }


    /* ==============================
       USER INFORMATION
    ============================== */

    const userEmail =
        user.email || "";

    const userName =
        user.user_metadata?.name ||
        user.user_metadata?.full_name ||
        "Seller";


    welcome.textContent =
        "Welcome, " +
        userName +
        "! Here are your products.";


    /* ==============================
       GET MY PRODUCTS
    ============================== */

    const {
        data: products,
        error
    } = await supabaseClient
        .from("products")
        .select("*")
        .eq("seller_email", userEmail)
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        productsContainer.innerHTML = `

            <div class="empty">

                <h2>
                    Could Not Load Products
                </h2>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

        return;
    }


    /* ==============================
       NO PRODUCTS
    ============================== */

    if (
        !products ||
        products.length === 0
    ) {

        productsContainer.innerHTML = `

            <div class="empty">

                <h2>
                    You Have No Products Yet
                </h2>

                <p>
                    Products you post will
                    appear here.
                </p>

                <a href="post-products.html">
                    Post a Product
                </a>

            </div>

        `;

        return;
    }


    /* ==============================
       DISPLAY PRODUCTS
    ============================== */

    products.forEach(
        function(product) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product-card";


            card.innerHTML = `

                <img
                    src="${escapeHTML(product.image_url || "")}"
                    alt="${escapeHTML(product.name || "Product")}"
                >


                <div class="product-info">

                    <h2>
                        ${escapeHTML(product.name || "Product")}
                    </h2>


                    <p class="price">
                        ${escapeHTML(
                            product.price ||
                            "Price not provided"
                        )}
                    </p>


                    <p>

                        <span class="category">
                            ${escapeHTML(
                                product.category ||
                                "Other"
                            )}
                        </span>

                    </p>


                    <p>
                        ${escapeHTML(
                            product.description ||
                            "No description available."
                        )}
                    </p>


                    <p>

                        <strong>
                            Seller:
                        </strong>

                        ${escapeHTML(
                            product.seller_name ||
                            userName ||
                            "Seller"
                        )}

                    </p>


                    <p>

                        <strong>
                            Phone:
                        </strong>

                        ${escapeHTML(
                            product.phone ||
                            "Not provided"
                        )}

                    </p>


                    <a
                        href="product-details.html?id=${encodeURIComponent(product.id)}"
                        class="button details-button"
                    >
                        👁️ View Details
                    </a>


                    <a
                        href="edit-product.html?id=${encodeURIComponent(product.id)}"
                        class="button edit-button"
                    >
                        ✏️ Edit Product
                    </a>


                    <button
                        type="button"
                        class="button delete-button"
                    >
                        🗑️ Delete Product
                    </button>

                </div>

            `;


            productsContainer.appendChild(
                card
            );


            /* ==============================
               DELETE BUTTON
            ============================== */

            const deleteButton =
                card.querySelector(
                    ".delete-button"
                );


            deleteButton.addEventListener(
                "click",
                function() {

                    selectedProductId =
                        product.id;

                    deleteModal.style.display =
                        "flex";

                }
            );

        }
    );

}


/* =================================
   CANCEL DELETE
================================= */

cancelDelete.addEventListener(
    "click",
    function() {

        selectedProductId =
            null;

        deleteModal.style.display =
            "none";

    }
);


/* =================================
   CONFIRM DELETE
================================= */

confirmDelete.addEventListener(
    "click",
    async function() {

        if (
            selectedProductId ===
            null
        ) {

            return;
        }


        confirmDelete.disabled = true;

        confirmDelete.textContent =
            "Deleting...";


        /* ==============================
           DELETE FROM SUPABASE
        ============================== */

        const {
            error
        } = await supabaseClient
            .from("products")
            .delete()
            .eq(
                "id",
                selectedProductId
            );


        if (error) {

            console.error(error);

            message.textContent =
                "Could not delete product: " +
                error.message;

            message.style.color =
                "red";

            confirmDelete.disabled =
                false;

            confirmDelete.textContent =
                "Yes, Delete";

            return;
        }


        /* ==============================
           SUCCESS
        ============================== */

        deleteModal.style.display =
            "none";

        selectedProductId =
            null;

        message.textContent =
            "Product deleted successfully!";

        message.style.color =
            "green";

        confirmDelete.disabled =
            false;

        confirmDelete.textContent =
            "Yes, Delete";


        /* Reload products */

        setTimeout(
            function() {

                loadMyProducts();

            },
            500
        );

    }
);


/* =================================
   CLOSE POPUP OUTSIDE
================================= */

deleteModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            deleteModal
        ) {

            selectedProductId =
                null;

            deleteModal.style.display =
                "none";

        }

    }
);


/* =================================
   START
================================= */

loadMyProducts();

</script>


</body>

</html>
