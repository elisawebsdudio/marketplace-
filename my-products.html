<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Products - MarketPlace</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f6;
}
  nav {
    background: #087f5b;
    padding: 12px 5px;
    text-align: center;

    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;

    gap: 5px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;

    padding: 7px 6px;

    border-radius: 5px;

    white-space: nowrap;

    display: inline-block;
}

nav a:hover {
    background: rgba(255,255,255,0.15);
}

@media (max-width: 500px) {

    nav {
        gap: 3px;
        padding: 10px 3px;
    }

    nav a {
        font-size: 12px;
        padding: 6px 5px;
    }

}

.container {
    width: 94%;
    max-width: 1100px;
    margin: 30px auto;
}

h1 {
    text-align: center;
    color: #087f5b;
}

.welcome {
    text-align: center;
    margin-bottom: 25px;
}

#productsContainer {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.product-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

.product-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    background: #eee;
}

.product-info {
    padding: 18px;
}

.product-info h2 {
    color: #087f5b;
    margin-top: 0;
}

.price {
    font-size: 20px;
    font-weight: bold;
}

.category {
    display: inline-block;
    background: #e8fff7;
    color: #087f5b;
    padding: 6px 10px;
    border-radius: 15px;
    font-weight: bold;
}

.button {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
    text-align: center;
    text-decoration: none;
    font-size: 16px;
    cursor: pointer;
}

.details-button {
    background: #087f5b;
    color: white;
}

.edit-button {
    background: #f4a261;
    color: white;
}

.delete-button {
    background: #d62828;
    color: white;
}

.empty {
    background: white;
    padding: 35px;
    text-align: center;
    border-radius: 10px;
    grid-column: 1 / -1;
}

.empty a {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 20px;
    background: #087f5b;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

#message {
    text-align: center;
    margin: 15px 0;
    font-weight: bold;
}


/* DELETE POPUP */

.modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-box {
    width: 100%;
    max-width: 400px;
    background: white;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px 25px rgba(0,0,0,0.3);
}

.modal-box h2 {
    color: #d62828;
    margin-top: 0;
}

.modal-box p {
    color: #444;
    line-height: 1.5;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modal-buttons button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.cancel-delete {
    background: #777;
    color: white;
}

.confirm-delete {
    background: #d62828;
    color: white;
}

</style>

</head>


<>


<nav>

<a href="index.html">Home</a>

<a href="products.html">Products</a>

<a href="post-products.html">Post Product</a>

<a href="favorites.html">Favorites</a>

<a href="my-products.html">My Products</a>

<a href="account.html">My Account</a>

</nav>


<div class="container">

<h1>
My Products
</h1>

<p
id="welcome"
class="welcome"
></p>

<p id="message"></p>

<div id="productsContainer"></div>

</div>


<!-- DELETE POPUP -->

<div
    id="deleteModal"
    class="modal"
>

    <div class="modal-box">

        <h2>
            Delete Product?
        </h2>

        <p>
            Are you sure you want to
            delete this product?
        </p>

        <div class="modal-buttons">

            <button
                type="button"
                id="cancelDelete"
                class="cancel-delete"
            >
                Cancel
            </button>

            <button
                type="button"
                id="confirmDelete"
                class="confirm-delete"
            >
                Yes, Delete
            </button>

        </div>

    </div>

</div>


<script>


/* =================================
   USER DATA
================================= */

const loggedIn =
localStorage.getItem("loggedIn");

const userEmail =
localStorage.getItem("userEmail");

const userName =
localStorage.getItem("userName");


/* =================================
   PAGE ELEMENTS
================================= */

const productsContainer =
document.getElementById(
    "productsContainer"
);

const welcome =
document.getElementById(
    "welcome"
);

const message =
document.getElementById(
    "message"
);

const deleteModal =
document.getElementById(
    "deleteModal"
);

const cancelDelete =
document.getElementById(
    "cancelDelete"
);

const confirmDelete =
document.getElementById(
    "confirmDelete"
);


/* =================================
   SELECTED PRODUCT
================================= */

let selectedProductIndex = null;


/* =================================
   CHECK LOGIN
================================= */

if (
    loggedIn !== "true" ||
    !userEmail
) {

    productsContainer.innerHTML = `

        <div class="empty">

            <h2>
                Login Required
            </h2>

            <p>
                Please login before
                viewing your products.
            </p>

            <a href="login.html">
                Login
            </a>

        </div>

    `;

} else {


    welcome.textContent =
        "Welcome, " +
        (userName || "Seller") +
        "! Here are your products.";


    /* =================================
       GET ALL PRODUCTS
    ================================= */

    let products = [];


    try {

        const savedProducts =
            localStorage.getItem(
                "products"
            );


        if (savedProducts) {

            products =
                JSON.parse(
                    savedProducts
                );

        }


        if (
            !Array.isArray(products)
        ) {

            products = [];

        }

    } catch (error) {

        products = [];

    }


    /* =================================
       FIND MY PRODUCTS
    ================================= */

    const currentEmail =
        String(userEmail)
        .trim()
        .toLowerCase();


    const myProducts =
        products
        .map(
            function(product, index) {

                return {
                    product: product,
                    index: index
                };

            }
        )
        .filter(
            function(item) {

                const sellerEmail =
                    String(
                        item.product.sellerEmail || ""
                    )
                    .trim()
                    .toLowerCase();


                return (
                    sellerEmail ===
                    currentEmail
                );

            }
        );


    /* =================================
       NO PRODUCTS
    ================================= */

    if (
        myProducts.length === 0
    ) {

        productsContainer.innerHTML = `

            <div class="empty">

                <h2>
                    You Have No Products Yet
                </h2>

                <p>
                    Products you post will
                    appear here.
                </p>

                <a href="post-products.html">
                    Post a Product
                </a>

            </div>

        `;

    } else {


        /* =================================
           SHOW PRODUCTS
        ================================= */

        myProducts.forEach(
            function(item) {

                const product =
                    item.product;

                const index =
                    item.index;


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "product-card";


                card.innerHTML = `

                    <img
                        src="${product.image || ""}"
                        alt="${product.name || "Product"}"
                    >


                    <div class="product-info">

                        <h2>
                            ${product.name || "Product"}
                        </h2>


                        <p class="price">
                            ${product.price || "Price not provided"}
                        </p>


                        <p>

                            <span class="category">
                                ${product.category || "Other"}
                            </span>

                        </p>


                        <p>
                            ${product.description || "No description available."}
                        </p>


                        <p>

                            <strong>
                                Seller:
                            </strong>

                            ${product.sellerName || userName || "Seller"}

                        </p>


                        <p>

                            <strong>
                                Phone:
                            </strong>

                            ${product.phone || "Not provided"}

                        </p>


                        <a
                            href="product-details.html?id=${index}"
                            class="button details-button"
                        >
                            👁️ View Details
                        </a>


                        <a
                            href="edit-product.html?id=${index}"
                            class="button edit-button"
                        >
                            ✏️ Edit Product
                        </a>


                        <button
                            type="button"
                            class="button delete-button"
                        >
                            🗑️ Delete Product
                        </button>

                    </div>

                `;


                productsContainer.appendChild(
                    card
                );


                /* =================================
                   DELETE BUTTON
                ================================= */

                const deleteButton =
                    card.querySelector(
                        ".delete-button"
                    );


                deleteButton.addEventListener(
                    "click",
                    function() {

                        selectedProductIndex =
                            index;


                        deleteModal.style.display =
                            "flex";

                    }
                );

            }
        );

    }

}


/* =================================
   CANCEL DELETE
================================= */

cancelDelete.addEventListener(
    "click",
    function() {

        selectedProductIndex =
            null;

        deleteModal.style.display =
            "none";

    }
);


/* =================================
   CONFIRM DELETE
================================= */

confirmDelete.addEventListener(
    "click",
    function() {

        if (
            selectedProductIndex ===
            null
        ) {

            return;

        }


        let products = [];


        try {

            const savedProducts =
                localStorage.getItem(
                    "products"
                );


            if (savedProducts) {

                products =
                    JSON.parse(
                        savedProducts
                    );

            }


            if (
                !Array.isArray(products)
            ) {

                products = [];

            }

        } catch (error) {

            message.textContent =
                "Could not load products.";

            message.style.color =
                "red";

            return;

        }


        /* DELETE */

        products.splice(
            selectedProductIndex,
            1
        );


        /* SAVE */

        try {

            localStorage.setItem(
                "products",
                JSON.stringify(
                    products
                )
            );


            deleteModal.style.display =
                "none";


            selectedProductIndex =
                null;


            message.textContent =
                "Product deleted successfully!";

            message.style.color =
                "green";


            setTimeout(
                function() {

                    window.location.reload();

                },
                700
            );


        } catch (error) {

            message.textContent =
                "Could not delete product.";

            message.style.color =
                "red";

        }

    }
);


/* =================================
   CLOSE POPUP BY CLICKING OUTSIDE
================================= */

deleteModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            deleteModal
        ) {

            selectedProductIndex =
                null;

            deleteModal.style.display =
                "none";

        }

    }
);




  
</script>


</body>

</html>
